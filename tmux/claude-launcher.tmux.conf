# claude-launcher.tmux.conf — the "invisible tmux" configuration.
#
# Every Claude Code session the launcher starts runs inside a tmux session, so
# that a second desktop can show read-only live mirrors of all of them at once.
# The user must never notice this. A launcher tab has to look and feel exactly
# like a plain terminal running `claude`: no status bar, no prefix key, no key
# stolen from the application, nothing left running once the window is gone.
#
# This file is loaded with `tmux -f`, which replaces BOTH the system config
# (/opt/homebrew/etc/tmux.conf) and the user's own ~/.tmux.conf — see tmux(1)
# under -f. Combined with the dedicated `-L claudelauncher` socket, the
# launcher's tmux server shares nothing with the user's personal tmux: not the
# config, not the socket, not the sessions, not the server process.
#
# Nothing here is meant to be edited by hand at runtime; `claude-launcher-session`
# and `claude-launcher-mirror` are the only two things that load it.

# ---------------------------------------------------------------------------
# Server options — teardown (requirement: nothing survives in the background)
# ---------------------------------------------------------------------------

# When the last session dies, the server process exits. This is what makes
# `tmux -L claudelauncher ls` report "no server running" once the final launcher
# window is closed. It is the default in tmux 3.6, but it is the single most
# important guarantee in this file, so it is stated explicitly.
set -s exit-empty on

# No delay after ESC. tmux's default of 500ms makes an application feel
# sluggish when the user presses Escape (which Claude Code uses constantly);
# 0 makes the pane indistinguishable from a bare terminal.
set -s escape-time 0

# ---------------------------------------------------------------------------
# Session teardown
# ---------------------------------------------------------------------------

# `on` = destroy a session as soon as its last client detaches.
#
# Why `on` and not `keep-last`/`keep-group`, given that each real session has a
# grouped mirror session hanging off it:
#
#   * The mirror attaches to its OWN session (`<name>__mirror`), which merely
#     shares the primary's windows. So when the user's iTerm2 window closes,
#     the primary session genuinely has zero clients and `on` does fire for it,
#     even while the mirror is still attached. `keep-last`/`keep-group` are
#     both wrong here: `keep-last` never destroys an ungrouped session (so a
#     session that never had a mirror would leak), and `keep-group` refuses to
#     destroy the last member of a group (so the mirror itself would leak).
#
#   * BUT destroying the primary is not enough on its own. Sessions in a group
#     share windows, and a window lives as long as ANY session links it — so
#     with the mirror still alive, killing the primary leaves the window, and
#     therefore the `claude` process, running. That is exactly the background
#     leak we must not have.
#
# So `destroy-unattached on` is a backstop, not the mechanism. Ownership is
# explicit: the `claude-launcher-session` process that hosts the tab traps
# HUP/TERM/INT/EXIT and kills the primary AND the mirror. The `session-closed`
# hook below is the second backstop, for any path that destroys a primary
# session without going through that trap.
set -g destroy-unattached on

# Reap the mirror whenever its primary session goes away, no matter what killed
# the primary. `run-shell -C` runs a tmux command rather than a shell command,
# so this needs no tmux binary on PATH, and run-shell discards stderr unless -E
# is given — meaning the "session not found" case (no mirror was ever attached)
# fails silently instead of flashing a tmux message over the user's pane.
# Killing the mirror re-fires this hook for `<name>__mirror`, which then looks
# for `<name>__mirror__mirror`, finds nothing, and stops. No recursion.
set-hook -g session-closed 'run-shell -b -C "kill-session -t =#{hook_session_name}__mirror"'

# When a session is destroyed, detach its clients (rather than silently moving
# them to some other session). This is what makes `claude-launcher-session`
# return, and therefore what makes its trap run.
set -g detach-on-destroy on

# When the command exits, the pane closes -> the window closes -> the session
# ends -> the server exits. A plain terminal running `claude` behaves the same
# way; `remain-on-exit on` would leave a dead pane sitting there instead.
set -g remain-on-exit off

# ---------------------------------------------------------------------------
# Invisibility — no tmux UI
# ---------------------------------------------------------------------------

# The one line of tmux chrome a user would ever see. Off.
set -g status off

# No prefix key at all, on either slot. With no prefix there is no way to reach
# the prefix key table, so every keystroke — including Ctrl-B, Ctrl-A and every
# modified key — is passed straight through to Claude Code.
set -g prefix None
set -g prefix2 None

# Belt and braces: empty the prefix table outright, so even a stray
# `send-prefix` from somewhere could not reach a binding.
#
# NOTE, deliberately: only the *prefix* table is emptied, never the root table.
# tmux's root table contains ONLY mouse bindings by default (verified with
# `list-keys -T root`: MouseDown*/MouseDrag*/Wheel*/DoubleClick*/TripleClick*),
# so it steals no keystrokes — but it is what makes `mouse on` below do
# anything at all. `unbind -a -T root` would silently kill trackpad scrolling.
#
# Also note that key bindings only ever affect keys typed by a user at an
# attached client. They have no bearing on commands we drive from OUTSIDE via
# the tmux CLI (`tmux -L claudelauncher kill-session`, `send-keys`,
# `display-message`, `list-clients`, ...): those go over the socket as commands,
# never through a key table. Emptying the prefix table costs the launcher
# nothing.
unbind -a -T prefix

# Copy mode is reachable by scrolling up with the trackpad (see `mouse on`),
# and it is the one place where tmux could still show itself. Two things make
# it indistinguishable from scrolling back in a plain terminal:
#
#   1. Blank the position indicator ("[12/100000]", drawn in the pane's
#      top-right corner) — otherwise it is visible proof that this is not a
#      plain terminal.
#
#   2. Make any ordinary keypress leave copy mode. tmux's root wheel binding
#      uses `copy-mode -e`, so scrolling back down to the bottom already exits
#      by itself; without this, though, a user who scrolls up and then starts
#      typing is silently stuck in a mode they cannot see, with their keys
#      being read as copy-mode commands instead of reaching Claude Code.
#      `Any` matches only keys that have no binding of their own, so PageUp,
#      the arrows, the wheel and mouse selection keep working normally. The
#      keystroke that triggers the exit is swallowed — tmux gives a binding no
#      way to re-inject the key that fired it — so scroll-up-then-type costs
#      one character, against being trapped in an invisible mode otherwise.
#
# mode-keys is pinned rather than left to tmux's default, which is chosen from
# $VISUAL/$EDITOR: the user's editor choice must not change how a launcher tab
# behaves. Both tables are covered anyway.
set -g copy-mode-position-format ''
set -g mode-keys emacs
bind -T copy-mode    Any send-keys -X cancel
bind -T copy-mode-vi Any send-keys -X cancel

# No status line means tmux's activity/silence alerts have nowhere to draw, but
# turn the monitoring off anyway so nothing can ever be flagged.
set -g activity-action none
set -g silence-action none
setw -g monitor-activity off
setw -g monitor-silence 0

# ---------------------------------------------------------------------------
# Bell passthrough — the launcher's notification channel
# ---------------------------------------------------------------------------
#
# The launcher relies on the terminal bell reaching iTerm2 (which turns it into
# a notification) when Claude Code needs attention. tmux only forwards a bell
# to its clients from alerts_check_bell(), and that function returns early if
# `monitor-bell` is off — so counter-intuitively, monitor-bell must be ON for
# the bell to reach the outer terminal at all. `bell-action any` then means
# "act on a bell in any window", and `visual-bell off` selects the real BEL
# rather than an on-screen tmux message.
setw -g monitor-bell on
set -g bell-action any
set -g visual-bell off

# ---------------------------------------------------------------------------
# Invisibility — terminal fidelity
# ---------------------------------------------------------------------------

# Claude Code should get the same colours, clipboard and title behaviour it
# would get running directly under iTerm2.
set -g default-terminal 'tmux-256color'
set -as terminal-features ',*:RGB'   # 24-bit colour through to the outer terminal
set -g allow-passthrough on          # let iTerm2-specific escape sequences (OSC 1337) through
set -g set-clipboard on              # OSC 52 copy-to-clipboard keeps working
set -g focus-events on               # the app still learns when the window gains/loses focus

# A plain terminal shows the running program's title. Propagate the pane title
# outward so the iTerm2 tab title does not freeze at whatever it was when tmux
# started.
set -g set-titles on
set -g set-titles-string '#{pane_title}'

# Deep scrollback, so scrolling up in a launcher tab finds as much history as a
# real terminal would.
set -g history-limit 100000

# Trackpad scrolling, selection and click-to-focus. See the `unbind` note above:
# this works because the root key table is left intact.
set -g mouse on

# ---------------------------------------------------------------------------
# Sizing — a small mirror must never clamp the user's real session
# ---------------------------------------------------------------------------
#
# The mirror pane on the overview desktop is small; the user's iTerm2 window is
# large. tmux sizes a window from the sessions/clients viewing it, so the naive
# setup lets a 40x12 mirror shrink a 120x40 Claude session to 40x12 — which
# would visibly wreck the user's tab.
#
# Two things prevent it, and they work together:
#
#   1. `claude-launcher-mirror` attaches with the `ignore-size` client flag
#      (part of what `attach-session -r` means), so the mirror client is
#      excluded from size calculations entirely. This is the real fix.
#
#   2. `window-size latest` sizes a window from the most recently active
#      client. Since the mirror is read-only it can never be the active one,
#      so even if a mirror somehow attached without `ignore-size`, the user's
#      session wins. `smallest` (the tmux default) would do the opposite and
#      hand the mirror control; `largest` would let an oversized mirror grow
#      the window past the edge of the user's window.
set -g window-size latest

# Size the window to the session actually viewing it, rather than to whatever
# session a client happens to be attached to. With grouped sessions this is
# what keeps the primary's dimensions tied to the primary's client.
setw -g aggressive-resize on
